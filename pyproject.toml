[project]
name = "chatgpt-mcp-chrome"
version = "0.1.0"
description = "MCP server for ChatGPT via Chrome browser automation (Playwright + CDP)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
chatgpt-mcp-chrome = "chatgpt_mcp_chrome:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatgpt_mcp_chrome"]
